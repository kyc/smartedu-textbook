name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: offline tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -m py_compile scripts/download_smartedu.py

      - name: CLI help
        run: python scripts/download_smartedu.py --help

      - name: Offline tests
        run: python -m unittest discover -s tests -v

  doctor:
    name: doctor (offline checks only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 不带 --verify：CI 不联网打平台接口，也不依赖任何凭证
      - name: Run doctor without network
        run: |
          export SMARTEDU_CACHE_DIR="$RUNNER_TEMP/smartedu-cache"
          python scripts/download_smartedu.py doctor
